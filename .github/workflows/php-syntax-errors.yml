name: PHP Syntax Errors

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  syntax:
    uses: a8cteam51/team51-configs/.github/workflows/reusable-php-syntax-check.yml@adec0d882cd5064a7bcc9533d3ebd8bab4a90d5c # update/php85-wp70-floors
    with:
      php-versions: '["8.5", "8.6"]'

  bootstrap-syntax:
    name: Bootstrap syntax (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Only the entry file must parse below the plugin's PHP floor; functions.php,
      # uninstall.php, and index.php load after the requirements gate and are excluded.
      # Discover it by its WordPress "Plugin Name:" header because generation renames the
      # file per repo without rewriting .github/.
      - name: Check the entry file for syntax errors
        run: |
          set -euo pipefail

          mapfile -t entry_files < <(grep -l 'Plugin Name:' "$GITHUB_WORKSPACE"/*.php || true)
          entry_count=${#entry_files[@]}
          if [ "$entry_count" -ne 1 ]; then
            echo "::error::expected exactly one root *.php file with a 'Plugin Name:' header, found $entry_count" >&2
            exit 1
          fi
          php -l "${entry_files[0]}"
