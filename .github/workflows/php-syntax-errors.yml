name: PHP Syntax Errors

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  syntax:
    uses: a8cteam51/team51-configs/.github/workflows/reusable-php-syntax-check.yml@adec0d882cd5064a7bcc9533d3ebd8bab4a90d5c # update/php85-wp70-floors
    with:
      php-versions: '["8.5", "8.6"]'

  bootstrap-syntax:
    name: Bootstrap syntax (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # The reusable syntax-check job lints the full tree and requires PHP 8.5+ syntax
      # support; below the plugin's PHP floor only the graceful-degradation bootstrap
      # files must still parse, so that path is checked directly rather than via the reusable.
      - name: Check bootstrap files for syntax errors
        run: find "$GITHUB_WORKSPACE" -maxdepth 1 \( -name 'team51-plugin-scaffold.php' -o -name 'functions-bootstrap.php' \) -print0 | xargs -0 -n 1 -P 4 php -l
