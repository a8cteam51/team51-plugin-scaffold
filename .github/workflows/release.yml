name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2, wp-cli
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'
          # Release builds run cache-free: runtime caches are a poisoning vector for artifact-publishing workflows, and setup-node caches by default.
          package-manager-cache: false
      - name: Validate changelog
        run: |
          composer install --no-interaction
          composer changelog:validate
      - name: Install production dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
      - name: Build assets
        run: |
          npm ci
          npm run build
      - name: Install dist-archive command
        run: |
          wp package install wp-cli/dist-archive-command:3.2.2
      - name: Create plugin archive
        run: |
          wp dist-archive . "./${GITHUB_REPOSITORY##*/}.zip" --plugin-dirname="${GITHUB_REPOSITORY##*/}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.zip --generate-notes
