name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  schedule:
    # Weekly Monday 06:00 UTC. Keeps zizmor's online audits (e.g.
    # known-vulnerable-actions) fresh between workflow changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # zizmor's SARIF upload in the called workflow needs this -- a reusable
  # workflow can never escalate beyond what the caller grants.
  security-events: write

jobs:
  workflow-checks:
    uses: a8cteam51/team51-configs/.github/workflows/reusable-workflow-checks.yml@update/php85-wp70-floors
